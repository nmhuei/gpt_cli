[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-cli"
version = "0.1.0"
description = "High-performance headless Wire Conduit runtime, telemetry monitor, and gateway for ChatGPT Web"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Light" }]
dependencies = [
    "curl_cffi>=0.7.4",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "playwright>=1.42.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gpt = "gpt_cli.cli.main:main"
gpt-cli = "gpt_cli.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpt_cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests as live network certification tests (deselect with '-m \"not live\"')",
]
